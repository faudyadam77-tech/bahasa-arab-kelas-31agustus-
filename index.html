<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrx7pm8HyqplUFGBVhW3JSb6Qlgj-5K5ImB5p1ExWHWFJ3DKe0RD0SmqyIkaImVXdZbA/exec";

    const bankSoalPG = [
        { soal: "Apa arti dari kata تِلْفَازٌ?", options: ["Meja tulis", "Televisi", "Sofa", "Jam"], jawaban: 1 },
        { soal: "Kata أَرِيكَةٌ dalam bahasa Indonesia berarti...", options: ["Karpet", "Vas bunga", "Sofa", "Dinding"], jawaban: 2 },
        { soal: "Keterangan tempat أَمَامَ artinya...", options: ["Di belakang", "Di samping", "Di depan", "Di atas"], jawaban: 2 },
        { soal: "Kata وَرَاءَ memiliki arti...", options: ["Di depan", "Di dalam", "Di antara", "Di belakang"], jawaban: 3 },
        { soal: "جَانِبَ artinya...", options: ["Di samping", "Di atas", "Di bawah", "Di dalam"], jawaban: 0 },
        { soal: "Keterangan tempat yang berarti 'di antara' adalah...", options: ["فِي", "عَلَى", "بَيْنَ", "أَمَامَ"], jawaban: 2 },
        { soal: "Kata فِي artinya...", options: ["Di atas", "Di dalam", "Di depan", "Di samping"], jawaban: 1 },
        { soal: "عَلَى berarti...", options: ["Di dalam", "Di belakang", "Di atas", "Di antara"], jawaban: 2 },
        { soal: "Kalimat هَارُونٌ أَمَامَ الْأَبِ artinya...", options: ["Harun di belakang ayah", "Harun di samping ayah", "Harun di depan ayah", "Harun di atas ayah"], jawaban: 2 },
        { soal: "أُمِّي وَرَاءَ الْأُخْتِ artinya...", options: ["Ibuku di depan saudara perempuan", "Ibuku di belakang saudara perempuan", "Ibuku di samping saudara perempuan", "Ibuku di antara saudara perempuan"], jawaban: 1 },
        { soal: "التِّلْفَازُ عَلَى الْمَكْتَبِ artinya...", options: ["TV di dalam meja", "TV di bawah meja", "TV di atas meja", "TV di samping meja"], jawaban: 2 },
        { soal: "الزَّهْرِيَّةُ فِي الْغُرْفَةِ artinya...", options: ["Vas bunga di atas ruangan", "Vas bunga di dalam ruangan", "Vas bunga di depan ruangan", "Vas bunga di belakang ruangan"], jawaban: 1 },
        { soal: "الْأَخُ بَيْنَ الْأَبِ وَالْأُمِّ artinya...", options: ["Saudara laki-laki di depan ayah dan ibu", "Saudara laki-laki di belakang ayah dan ibu", "Saudara laki-laki di antara ayah dan ibu", "Saudara laki-laki di samping ayah dan ibu"], jawaban: 2 },
        { soal: "Kata مِفْرَشٌ artinya...", options: ["Jam", "Karpet", "Meja", "Dinding"], jawaban: 1 },
        { soal: "الْجِدَارُ وَرَاءَ الْأَرِيكَةِ artinya...", options: ["Dinding di depan sofa", "Dinding di samping sofa", "Dinding di belakang sofa", "Dinding di atas sofa"], jawaban: 2 },
        { soal: "Keterangan tempat yang selalu diikuti dua objek dengan huruf وَ adalah...", options: ["أَمَامَ", "وَرَاءَ", "جَانِبَ", "بَيْنَ"], jawaban: 3 },
        { soal: "سَاعَةٌ artinya...", options: ["Vas bunga", "Jam", "Sofa", "Meja tulis"], jawaban: 1 },
        { soal: "Kalimat yang benar untuk 'Ibu di samping ayah' adalah...", options: ["الْأُمُّ أَمَامَ الْأَبِ", "الْأُمُّ وَرَاءَ الْأَبِ", "الْأُمُّ جَانِبَ الْأَبِ", "الْأُمُّ فِي الْأَبِ"], jawaban: 2 },
        { soal: "Jika buku berada di dalam tas, kalimat Arabnya adalah...", options: ["الْكِتَابُ عَلَى الْحَقِيبَةِ", "الْكِتَابُ فِي الْحَقِيبَةِ", "الْكِتَابُ أَمَامَ الْحَقِيبَةِ", "الْكِتَابُ وَرَاءَ الْحَقِيبَةِ"], jawaban: 1 },
        { soal: "غُرْفَةُ الْعَائِلَةِ artinya...", options: ["Ruang tamu", "Ruang keluarga", "Ruang tidur", "Ruang makan"], jawaban: 1 }
    ];

    const bankSoalEssay = [
        { soal: "Sebutkan 6 ظَرْفُ الْمَكَانِ (keterangan tempat) yang telah dipelajari beserta artinya!", jawaban: "أَمَامَ = Di depan, وَرَاءَ = Di belakang, جَانِبَ = Di samping, بَيْنَ = Di antara, فِي = Di dalam, عَلَى = Di atas" },
        { soal: "Terjemahkan kalimat berikut ke dalam bahasa Indonesia: هَارُونٌ أَمَامَ التِّلْفَازِ", jawaban: "Harun di depan TV" },
        { soal: "Terjemahkan kalimat berikut ke dalam bahasa Indonesia: الْأَبُ جَانِبَ الْأُمِّ", jawaban: "Ayah di samping ibu" },
        { soal: "Buatlah kalimat bahasa Arab untuk menyatakan 'Vas bunga di atas meja'!", jawaban: "الزَّهْرِيَّةُ عَلَى الْمَكْتَبِ" },
        { soal: "Buatlah kalimat bahasa Arab untuk menyatakan 'Karpet di dalam ruangan'!", jawaban: "الْمِفْرَشُ فِي الْغُرْفَةِ" },
        { soal: "Jelaskan perbedaan penggunaan بَيْنَ dengan keterangan tempat lainnya!", jawaban: "بَيْنَ selalu diikuti dua objek yang dihubungkan dengan huruf وَ (dan). Contoh: بَيْنَ الْأَبِ وَالْأُمِّ. Sedangkan keterangan tempat lain hanya membutuhkan satu objek." },
        { soal: "Terjemahkan kalimat berikut ke dalam bahasa Arab: 'Dinding di belakang sofa'", jawaban: "الْجِدَارُ وَرَاءَ الْأَرِيكَةِ" },
        { soal: "Terjemahkan kalimat berikut ke dalam bahasa Arab: 'Saudara laki-laki di antara ayah dan ibu'", jawaban: "الْأَخُ بَيْنَ الْأَبِ وَالْأُمِّ" },
        { soal: "Sebutkan 5 kosakata benda-benda yang ada di ruang keluarga dalam bahasa Arab beserta artinya!", jawaban: "تِلْفَازٌ = Televisi, أَرِيكَةٌ = Sofa, مَكْتَبٌ = Meja tulis, سَاعَةٌ = Jam, مِفْرَشٌ = Karpet" },
        { soal: "Buatlah 3 kalimat sederhana menggunakan ظَرْفُ الْمَكَانِ yang berbeda-beda, lalu terjemahkan ke dalam bahasa Indonesia!", jawaban: "Contoh: التِّلْفَازُ عَلَى الْمَكْتَبِ (TV di atas meja), الْأُمُّ فِي الْغُرْفَةِ (Ibu di dalam ruangan), هَارُونٌ أَمَامَ الْأَبِ (Harun di depan ayah)" }
    ];

    let currentSession = { name: '', class: '', sessionNumber: 1, soalPG: [], soalEssay: [], jawabanPG: [], jawabanEssay: [] };

    function showSection(section) {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('materiSection').style.display = 'none';
        document.getElementById('quizSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'none';

        if (section === 'menu') document.getElementById('mainMenu').style.display = 'block';
        else if (section === 'login') document.getElementById('loginSection').style.display = 'block';
        else if (section === 'materi') document.getElementById('materiSection').style.display = 'block';
        else if (section === 'quiz') document.getElementById('quizSection').style.display = 'block';
        else if (section === 'result') document.getElementById('resultSection').style.display = 'block';
        
        window.scrollTo(0, 0);
    }

    function shuffleArray(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    function startQuiz() {
        const name = document.getElementById('studentName').value.trim();
        const kelas = document.getElementById('studentClass').value.trim();

        if (!name) { alert('️ Silakan masukkan nama lengkap Anda!'); return; }
        if (!kelas) { alert('️ Silakan masukkan kelas Anda!'); return; }

        currentSession.name = name;
        currentSession.class = kelas;

        const shuffledPG = shuffleArray(bankSoalPG);
        currentSession.soalPG = shuffledPG.slice(0, 7);

        const shuffledEssay = shuffleArray(bankSoalEssay);
        currentSession.soalEssay = shuffledEssay.slice(0, 3);

        currentSession.jawabanPG = new Array(7).fill(null);
        currentSession.jawabanEssay = new Array(3).fill('');

        document.getElementById('studentInfo').innerHTML = `
            <strong> Nama:</strong> ${currentSession.name} | 
            <strong>🏫 Kelas:</strong> ${currentSession.class} |
            <strong> Sesi ke:</strong> ${currentSession.sessionNumber}
        `;

        renderQuiz();
        showSection('quiz');
    }

    function renderQuiz() {
        let html = '<h2 style="color: #667eea; margin-bottom: 20px;">📝 Soal Latihan</h2>';

        html += '<div class="section"><h3>A. Pilihan Ganda (7 Soal)</h3><p style="margin-bottom:15px;color:#666;">Pilihlah satu jawaban yang paling benar!</p>';
        currentSession.soalPG.forEach((soal, index) => {
            html += `
                <div class="question">
                    <h4>${index + 1}. ${soal.soal}</h4>
                    <div class="options">
                        ${soal.options.map((option, optIndex) => `
                            <label class="option">
                                <input type="radio" name="pg${index}" value="${optIndex}" 
                                    onchange="currentSession.jawabanPG[${index}] = ${optIndex}">
                                ${String.fromCharCode(65 + optIndex)}. ${option}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        html += '</div>';

        html += '<div class="section"><h3>B. Essay (3 Soal)</h3><p style="margin-bottom:15px;color:#666;">Jawablah pertanyaan berikut dengan jelas! (Akan dinilai oleh guru)</p>';
        currentSession.soalEssay.forEach((soal, index) => {
            html += `
                <div class="question">
                    <h4>${index + 1}. ${soal.soal}</h4>
                    <div class="form-group">
                        <textarea id="essay${index}" rows="4" placeholder="Tulis jawaban Anda di sini..."
                            oninput="currentSession.jawabanEssay[${index}] = this.value"></textarea>
                    </div>
                </div>
            `;
        });
        html += '</div>';

        document.getElementById('quizContent').innerHTML = html;
    }

    // ============================================
    // PERBAIKAN: Metode pengiriman data yang RELIABLE
    // ============================================
    async function sendDataToSpreadsheet(data) {
        try {
            console.log('📤 Mengirim data:', JSON.stringify(data));
            
            // Metode: Kirim sebagai JSON string dengan Content-Type text/plain
            // Ini metode PALING RELIABLE untuk Google Apps Script
            const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(data)
            });

            console.log('✅ Response status:', response.status);
            return { status: 'success', message: 'Data berhasil dikirim!' };
        } catch (error) {
            console.error(' Error:', error);
            return { status: 'error', message: error.message };
        }
    }

    async function submitQuiz() {
        const unansweredPG = currentSession.jawabanPG.filter(j => j === null).length;
        if (unansweredPG > 0) {
            if (!confirm(`⚠️ Masih ada ${unansweredPG} soal pilihan ganda yang belum dijawab. Yakin ingin mengumpulkan?`)) {
                return;
            }
        }

        const unansweredEssay = currentSession.jawabanEssay.filter(j => j.trim() === '').length;
        if (unansweredEssay > 0) {
            if (!confirm(`⚠️ Masih ada ${unansweredEssay} soal essay yang belum dijawab. Yakin ingin mengumpulkan?`)) {
                return;
            }
        }

        if (!confirm('✅ Yakin ingin mengumpulkan jawaban? Data akan dikirim ke guru.')) {
            return;
        }

        let skorPG = 0;
        currentSession.soalPG.forEach((soal, index) => {
            if (currentSession.jawabanPG[index] === soal.jawaban) {
                skorPG++;
            }
        });

        const skorPGFinal = (skorPG / 7) * 70;
        const jawabanPGFormatted = currentSession.jawabanPG.map(j => 
            j !== null ? String.fromCharCode(65 + j) : '-'
        );

        const dataToSend = {
            nama: currentSession.name,
            kelas: currentSession.class,
            sesi: currentSession.sessionNumber,
            nilaiPG: skorPGFinal.toFixed(1),
            benarPG: `${skorPG}/7`,
            jawabanPG: jawabanPGFormatted,
            jawabanEssay: currentSession.jawabanEssay.map(j => j.trim() || '-')
        };

        console.log(' Data yang akan dikirim:', dataToSend);

        // Tampilkan loading
        document.getElementById('dynamicLoadingOverlay').style.display = 'flex';
        document.getElementById('submitBtn').disabled = true;

        const result = await sendDataToSpreadsheet(dataToSend);

        // Sembunyikan loading
        document.getElementById('dynamicLoadingOverlay').style.display = 'none';
        document.getElementById('submitBtn').disabled = false;

        let resultHTML = `
            <h2> Hasil Latihan</h2>
            <p><strong>👤 Nama:</strong> ${currentSession.name}</p>
            <p><strong> Kelas:</strong> ${currentSession.class}</p>
            <p><strong>📝 Sesi ke:</strong> ${currentSession.sessionNumber}</p>
            <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.3);">
            <p style="font-size: 1.5em;"><strong> Nilai Pilihan Ganda: ${skorPGFinal.toFixed(1)} / 70</strong></p>
            <p><strong>✅ Benar:</strong> ${skorPG} dari 7 soal</p>
            <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.3);">
        `;

        if (result.status === 'success') {
            resultHTML += `<p><span class="status-badge status-success">✅ Data BERHASIL dikirim ke guru!</span></p>`;
        } else {
            resultHTML += `<p><span class="status-badge status-error">❌ GAGAL mengirim: ${result.message}</span></p>`;
            resultHTML += `<p style="margin-top:10px;"><span class="status-badge status-pending">⚠️ Screenshot hasil ini dan kirim ke guru secara manual!</span></p>`;
        }

        resultHTML += `
            <div class="essay-notice">
                <strong>📝 Catatan:</strong> Jawaban essay Anda sudah dikirim ke guru dan akan dinilai secara manual. 
                Nilai akhir akan diumumkan oleh guru.
            </div>
        `;

        resultHTML += '<div class="answer-review">';
        resultHTML += '<h3 style="color: #667eea; margin-bottom: 15px;">📋 Review Jawaban Pilihan Ganda:</h3>';
        
        currentSession.soalPG.forEach((soal, index) => {
            const isCorrect = currentSession.jawabanPG[index] === soal.jawaban;
            const status = isCorrect ? '✅' : '❌';
            const studentAnswer = currentSession.jawabanPG[index] !== null 
                ? String.fromCharCode(65 + currentSession.jawabanPG[index]) 
                : '-';
            const correctAnswer = String.fromCharCode(65 + soal.jawaban);
            
            resultHTML += `
                <div class="answer-item ${isCorrect ? 'correct' : 'wrong'}">
                    <strong>${index + 1}.</strong> ${status} 
                    Jawaban Anda: <strong>${studentAnswer}</strong> | 
                    Kunci: <strong>${correctAnswer}. ${soal.options[soal.jawaban]}</strong>
                </div>
            `;
        });
        
        resultHTML += '</div>';

        document.getElementById('resultContent').innerHTML = resultHTML;
        showSection('result');

        currentSession.sessionNumber++;
    }

    function startNewSession() {
        document.getElementById('studentName').value = currentSession.name;
        document.getElementById('studentClass').value = currentSession.class;
        showSection('login');
    }
</script>
